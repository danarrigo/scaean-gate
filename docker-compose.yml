services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sso_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic sso-session-events --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
        --topic sso-session-events-dlq --partitions 1 --replication-factor 1

  auth-provider:
    build: ./auth-provider/server
    restart: unless-stopped
    environment:
      PORT: 8080
      FRONTEND_URL: http://localhost:4200
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4202
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sso_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: sso_db
      DB_SSLMODE: disable
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?set SEED_USER_PASSWORD in .env}
      APP_A_CLIENT_SECRET: ${APP_A_CLIENT_SECRET:?set APP_A_CLIENT_SECRET in .env}
      APP_B_CLIENT_SECRET: ${APP_B_CLIENT_SECRET:?set APP_B_CLIENT_SECRET in .env}
      APP_A_LOGOUT_URL: http://app-a:8081/internal/logout
      APP_B_LOGOUT_URL: http://app-b:8082/internal/logout
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: sso-session-events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-a:
    build: ./applications/app-a
    restart: unless-stopped
    environment:
      PORT: 8081
      APP_NAME: Apex
      CLIENT_ID: app-a-client-id
      CLIENT_SECRET: ${APP_A_CLIENT_SECRET:?set APP_A_CLIENT_SECRET in .env}
      AUTH_PROVIDER_URL: http://localhost:8080
      AUTH_PROVIDER_INTERNAL_URL: http://auth-provider:8080
      REDIRECT_URI: http://localhost:8081/auth/callback
      FRONTEND_URL: http://localhost:4201
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sso_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: app_a_db
      DB_SSLMODE: disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      auth-provider:
        condition: service_healthy

  app-b:
    build: ./applications/app-b
    restart: unless-stopped
    environment:
      PORT: 8082
      APP_NAME: Bolt
      CLIENT_ID: app-b-client-id
      CLIENT_SECRET: ${APP_B_CLIENT_SECRET:?set APP_B_CLIENT_SECRET in .env}
      AUTH_PROVIDER_URL: http://localhost:8080
      AUTH_PROVIDER_INTERNAL_URL: http://auth-provider:8080
      REDIRECT_URI: http://localhost:8082/auth/callback
      FRONTEND_URL: http://localhost:4202
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sso_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: app_b_db
      DB_SSLMODE: disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth-provider:
        condition: service_healthy

  sync-worker:
    build: ./auth-provider/sync-worker
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: sso-session-events
      KAFKA_GROUP_ID: sync-worker-group
      KAFKA_DLQ_TOPIC: sso-session-events-dlq
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sso_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: sso_db
      DB_SSLMODE: disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      app-a:
        condition: service_started
      app-b:
        condition: service_started

  control-panel:
    build: ./auth-provider/control-panel
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      auth-provider:
        condition: service_healthy

  app-a-client:
    build: ./applications/app-a/client
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      app-a:
        condition: service_started

  app-b-client:
    build: ./applications/app-b/client
    restart: unless-stopped
    ports:
      - "4202:80"
    depends_on:
      app-b:
        condition: service_started

volumes:
  pgdata:
