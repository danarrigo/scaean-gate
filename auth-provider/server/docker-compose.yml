services:
  postgres:
    image: postgres:16-alpine
    container_name: sso_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sso_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sso_password}
      POSTGRES_DB: ${DB_NAME:-sso_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
